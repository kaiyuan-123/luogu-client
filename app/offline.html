<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>洛谷 · 连接失败</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: rgba(20, 22, 26, 0.92);
        color: #d7dae0;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
      }
      /* 无边框窗口：这条就是拖动区（同时是关闭按钮所在） */
      .titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 6px;
        -webkit-app-region: drag;
      }
      .titlebar button {
        -webkit-app-region: no-drag;
        width: 30px;
        height: 26px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #cfd5df;
        font-size: 14px;
        cursor: pointer;
      }
      .titlebar button:hover { background: #e81123; color: #fff; }
      .box { text-align: center; max-width: 460px; padding: 24px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; color: #eef1f6; }
      p { font-size: 13px; line-height: 1.8; color: #8b93a1; margin: 6px 0; }
      button.retry {
        margin-top: 22px;
        padding: 9px 26px;
        font-size: 13px;
        color: #eaf2ff;
        background: #1f6feb;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button.retry:hover { background: #2b7cf7; }
      code { color: #b9c2d0; }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <button id="close" title="关闭">✕</button>
    </div>
    <div class="box">
      <h1>连不上洛谷</h1>
      <p id="msg">网络好像断了，或者洛谷暂时打不开。</p>
      <p><code id="detail"></code></p>
      <button class="retry" id="retry">重试</button>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const target = params.get('url') || 'https://www.luogu.com.cn/';
      const code = params.get('code');
      if (code) document.getElementById('detail').textContent = '错误代码 ' + code;
      document.getElementById('retry').addEventListener('click', () => {
        location.href = target;
      });
      document.getElementById('close').addEventListener('click', () => window.close());
    </script>
  </body>
</html>
